  </text>

  <text
    x="430"
    y="285"
    class="value">
    1
  </text>

  <!-- Grade circle -->
  <circle
    cx="500"
    cy="190"
    r="52"
    fill="#1f2230"
    stroke="#405274"
    stroke-width="5"
