<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="620"
  viewBox="0 0 1100 620"
  role="img"
  aria-label="GitHub statistics">

  <style>
    .section {
      font: 700 22px Arial, sans-serif;
      fill: #aab6c7;
    }

    .card-title {
      font: 700 18px Arial, sans-serif;
      fill: #9fc1ef;
    }

    .metric {
      font: 700 14px Arial, sans-serif;
      fill: #7dd3c7;
    }

    .value {
      font: 700 15px Arial, sans-serif;
      fill: #7dd3c7;
    }

    .language {
      font: 500 13px Arial, sans-serif;
      fill: #7dd3c7;
    }

    .footer {
      font: 500 14px Arial, sans-serif;
      fill: #8b949e;
    }

    .stat-label {
      font: 500 14px Arial, sans-serif;
      fill: #cbd5e1;
    }

    .stat-value {
      font: 700 30px Arial, sans-serif;
    }
  </style>

  <rect
    width="1100"
    height="620"
    fill="#ffffff"
  />

  <!-- GitHub Stats heading -->
  <text
    x="30"
    y="45"
    class="section">
    📊 GitHub Stats
  </text>

  <line
    x1="25"
    y1="62"
    x2="1075"
    y2="62"
    stroke="#cbd5e1"
    stroke-width="1"
  />

  <!-- Stats background -->
  <rect
    x="55"
    y="82"
    width="990"
    height="255"
    rx="8"
    fill="#151922"
  />

  <!-- Left card -->
  <rect
    x="75"
    y="102"
    width="470"
    height="215"
    rx="6"
    fill="#1f2230"
    stroke="#344050"
  />

  <text
    x="100"
    y="132"
    class="card-title">
    Sandeep Pushkar's GitHub Stats
  </text>

  <text
    x="100"
    y="163"
    class="metric">
    ☆ Total Stars Earned:
  </text>

  <text
    x="435"
    y="163"
    class="value">
    0
  </text>

  <text
    x="100"
    y="195"
    class="metric">
    ↻ Total Commits (2026):
  </text>

  <text
    x="435"
    y="195"
    class="value">
    25
  </text>

  <text
    x="100"
    y="227"
    class="metric">
    ⇅ Total PRs:
  </text>

  <text
    x="435"
    y="227"
    class="value">
    0
  </text>

  <text
    x="100"
    y="259"
    class="metric">
    ⓘ Total Issues:
  </text>

  <text
    x="435"
    y="259"
    class="value">
    0
  </text>

  <text
    x="100"
    y="291"
    class="metric">
    ▣ Contributed to (last year):
  </text>

  <text
    x="435"
    y="291"
    class="value">
    1
  </text>

  <!-- Grade circle -->
  <circle
    cx="495"
    cy="210"
    r="42"
    fill="#1f2230"
    stroke="#405274"
    stroke-width="5"
  />

  <circle
    cx="495"
    cy="210"
    r="39"
    fill="none"
    stroke="#58a6ff"
    stroke-width="5"
    stroke-dasharray="95 245"
    stroke-linecap="round"
    transform="rotate(-90 495 210)"
  />

  <text
    x="495"
    y="218"
    text-anchor="middle"
    style="font:700 21px Arial;fill:#58a6ff;">
    C+
  </text>

  <!-- Right card -->
  <rect
    x="565"
    y="102"
    width="460"
    height="215"
    rx="6"
    fill="#1f2230"
    stroke="#344050"
  />

  <text
    x="590"
    y="132"
    class="card-title">
    Most Used Languages
  </text>

  <!-- Language bar background -->
  <rect
    x="705"
    y="160"
    width="300"
    height="10"
    rx="5"
    fill="#39404b"
  />

  

  
    <text
      x="705"
      y="230"
      class="language">
      No public language data
    </text>
    

  <!-- Followers -->
  <line
    x1="590"
    y1="278"
    x2="1000"
    y2="278"
    stroke="#39404b"
  />

  <text
    x="620"
    y="303"
    style="font:500 14px Arial;fill:#cbd5e1;">
    👥 Followers:
  </text>

  <text
    x="735"
    y="303"
    style="font:700 14px Arial;fill:#cbd5e1;">
    11
  </text>

  <text
    x="835"
    y="303"
    style="font:500 14px Arial;fill:#cbd5e1;">
    👤 Following:
  </text>

  <text
    x="950"
    y="303"
    style="font:700 14px Arial;fill:#cbd5e1;">
    5
  </text>

  <!-- Streak heading -->
  <line
    x1="25"
    y1="370"
    x2="1075"
    y2="370"
    stroke="#cbd5e1"
  />

  <text
    x="30"
    y="405"
    class="section">
    🔥 Streak Stats
  </text>

  <!-- Streak card -->
  <rect
    x="55"
    y="425"
    width="990"
    height="110"
    rx="6"
    fill="#1f2230"
  />

  <text
    x="150"
    y="470"
    class="stat-label">
    Current Streak
  </text>

  <text
    x="180"
    y="510"
    class="stat-value"
    fill="#58a6ff">
    0
  </text>

  <text
    x="225"
    y="510"
    class="stat-label">
    days
  </text>

  <text
    x="430"
    y="470"
    class="stat-label">
    Longest Streak
  </text>

  <text
    x="455"
    y="510"
    class="stat-value"
    fill="#a371f7">
    0
  </text>

  <text
    x="500"
    y="510"
    class="stat-label">
    days
  </text>

  <text
    x="710"
    y="470"
    class="stat-label">
    Total Contributions
  </text>

  <text
    x="790"
    y="510"
    class="stat-value"
    fill="#f2cc60">
    54
  </text>

  <text
    x="30"
    y="590"
    class="footer">
    Note: Stats are updated daily via GitHub Actions 🚀
  </text>

</svg>