<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1100"
  height="440"
  viewBox="0 0 1100 440"
  role="img"
  aria-labelledby="title description">

  <title id="title">
    Sandeep Pushkar's GitHub Statistics
  </title>

  <desc id="description">
    GitHub statistics and most used programming languages
  </desc>

  <style>
    .title {
      font: 700 24px Arial, sans-serif;
      fill: #e6edf3;
    }

    .subtitle {
      font: 500 15px Arial, sans-serif;
      fill: #8b949e;
    }

    .label {
      font: 600 15px Arial, sans-serif;
      fill: #8b949e;
    }

    .value {
      font: 700 25px Arial, sans-serif;
      fill: #e6edf3;
    }

    .language {
      font: 600 14px Arial, sans-serif;
      fill: #c9d1d9;
    }

    .percentage {
      font: 500 13px Arial, sans-serif;
      fill: #8b949e;
    }

    .muted {
      font: 500 15px Arial, sans-serif;
      fill: #8b949e;
    }
  </style>

  <rect
    width="100%"
    height="100%"
    rx="18"
    fill="#0d1117"/>

  <!-- Left stats card -->
  <rect
    x="30"
    y="30"
    width="510"
    height="380"
    rx="16"
    fill="#161b22"
    stroke="#30363d"/>

  <text
    x="65"
    y="80"
    class="title">
    Sandeep Pushkar's GitHub Stats
  </text>

  <text
    x="65"
    y="110"
    class="subtitle">
    @sprexe • Updated automatically
  </text>

  <line
    x1="65"
    y1="135"
    x2="505"
    y2="135"
    stroke="#30363d"/>

  <text
    x="65"
    y="180"
    class="label">
    Total Stars Earned
  </text>

  <text
    x="65"
    y="215"
    class="value">
    0
  </text>

  <text
    x="280"
    y="180"
    class="label">
    Repositories
  </text>

  <text
    x="280"
    y="215"
    class="value">
    5
  </text>

  <text
    x="65"
    y="275"
    class="label">
    Commits (2026)
  </text>

  <text
    x="65"
    y="310"
    class="value">
    23
  </text>

  <text
    x="280"
    y="275"
    class="label">
    Pull Requests
  </text>

  <text
    x="280"
    y="310"
    class="value">
    0
  </text>

  <text
    x="65"
    y="370"
    class="label">
    Issues
  </text>

  <text
    x="65"
    y="400"
    class="value">
    0
  </text>

  <circle
    cx="450"
    cy="355"
    r="48"
    fill="none"
    stroke="#58a6ff"
    stroke-width="8"/>

  <text
    x="450"
    y="365"
    text-anchor="middle"
    style="font: 700 28px Arial, sans-serif; fill:#58a6ff;">
    C
  </text>

  <!-- Right languages card -->
  <rect
    x="570"
    y="30"
    width="500"
    height="380"
    rx="16"
    fill="#161b22"
    stroke="#30363d"/>

  <text
    x="620"
    y="85"
    class="title">
    Most Used Languages
  </text>

  <text
    x="620"
    y="115"
    class="subtitle">
    Based on your public repositories
  </text>

  <rect
    x="620"
    y="140"
    width="400"
    height="12"
    rx="6"
    fill="#30363d"/>

  

  
    <text x="620"
          y="210"
          class="muted">
      No public language data available
    </text>
    

  <line
    x1="620"
    y1="350"
    x2="1020"
    y2="350"
    stroke="#30363d"/>

  <text
    x="620"
    y="385"
    class="subtitle">
    Followers: 11
  </text>

  <text
    x="850"
    y="385"
    class="subtitle">
    Following: 5
  </text>

</svg>