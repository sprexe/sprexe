  <circle
    cx="500"
    cy="190"
    r="48"
    fill="none"
    stroke="#58a6ff"
    stroke-width="6"
    stroke-dasharray="120 302"
    stroke-linecap="round"
    transform="rotate(-90 500 190)"
  />

  <text
    x="500"
    y="198"
    text-anchor="middle"
    style="font:700 22px Arial;fill:#58a6ff;">
    D
  </text>

  <!-- Right Card -->
  <rect
    x="565"
    y="85"
    width="450"
    height="245"
    rx="5"
