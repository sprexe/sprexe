    ☆ Total Stars Earned:
  </text>

  <text
    x="430"
    y="145"
    class="value">
    0
  </text>

  <text
    x="85"
    y="180"
    class="metric">
    ↻ Total Commits (2026):
  </text>

  <text
    x="430"
    y="180"
    class="value">
    24
  </text>

  <text
    x="85"
    y="215"
    class="metric">
    ⇅ Total PRs:
  </text>

  <text
    x="430"
    y="215"
    class="value">
    0
  </text>

  <text
    x="85"
    y="250"
    class="metric">
    ⓘ Total Issues:
  </text>

  <text
    x="430"
    y="250"
    class="value">
    0
  </text>

  <text
    x="85"
    y="285"
    class="metric">
