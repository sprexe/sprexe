    days
  </text>

  <text
    x="420"
    y="475"
    class="stat-label">
    Longest Streak
  </text>

  <text
    x="440"
    y="515"
    class="stat-value"
    fill="#a371f7">
    0
  </text>

  <text
    x="480"
    y="515"
    class="stat-label">
    days
  </text>

  <text
    x="700"
    y="475"
    class="stat-label">
    Total Contributions
  </text>

  <text
    x="770"
    y="515"
    class="stat-value"
    fill="#f2cc60">
    53
  </text>

  <text
