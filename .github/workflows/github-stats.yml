name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import html
          from datetime import datetime, timezone

          username = "sprexe"
          token = os.environ["GH_TOKEN"]

          now = datetime.now(timezone.utc)
          current_year = now.year

          year_start = datetime(
              current_year, 1, 1, 0, 0, 0,
              tzinfo=timezone.utc
          ).isoformat()

          year_end = datetime(
              current_year, 12, 31, 23, 59, 59,
              tzinfo=timezone.utc
          ).isoformat()

          last_year_start = datetime(
              current_year - 1, 1, 1, 0, 0, 0,
              tzinfo=timezone.utc
          ).isoformat()

          last_year_end = datetime(
              current_year - 1, 12, 31, 23, 59, 59,
              tzinfo=timezone.utc
          ).isoformat()


          def graphql(query, variables):
              payload = json.dumps({
                  "query": query,
                  "variables": variables
              }).encode()

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "sprexe-github-stats"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  data = json.load(response)

              if "errors" in data:
                  raise RuntimeError(
                      json.dumps(data["errors"])
                  )

              return data["data"]


          def rest_get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "sprexe-github-stats",
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  return json.load(response)


          # --------------------------------
          # GraphQL stats
          # --------------------------------

          query = """
          query(
            $login: String!,
            $currentFrom: DateTime!,
            $currentTo: DateTime!,
            $lastFrom: DateTime!,
            $lastTo: DateTime!
          ) {
            user(login: $login) {
              name
              login

              followers {
                totalCount
              }

              following {
                totalCount
              }

              repositories(
                ownerAffiliations: OWNER,
                first: 100,
                privacy: PUBLIC
              ) {
                totalCount

                nodes {
                  name
                  stargazerCount
                }
              }

              currentYear: contributionsCollection(
                from: $currentFrom,
                to: $currentTo
              ) {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions

                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }

              lastYear: contributionsCollection(
                from: $lastFrom,
                to: $lastTo
              ) {
                totalCommitContributions
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """

          data = graphql(
              query,
              {
                  "login": username,
                  "currentFrom": year_start,
                  "currentTo": year_end,
                  "lastFrom": last_year_start,
                  "lastTo": last_year_end
              }
          )

          user = data["user"]

          if not user:
              raise RuntimeError(
                  "GitHub user not found"
              )

          repositories = user["repositories"]["nodes"]

          total_stars = sum(
              repo["stargazerCount"]
              for repo in repositories
          )

          repository_count = (
              user["repositories"]["totalCount"]
          )

          commits = (
              user["currentYear"]
              ["totalCommitContributions"]
          )

          prs = (
              user["currentYear"]
              ["totalPullRequestContributions"]
          )

          issues = (
              user["currentYear"]
              ["totalIssueContributions"]
          )

          contributed_last_year = (
              user["lastYear"]
              ["contributionCalendar"]
              ["totalContributions"]
          )


          # --------------------------------
          # REST API language data
          # --------------------------------

          language_sizes = {}

          repos_url = (
              "https://api.github.com/users/"
              + urllib.parse.quote(username)
              + "/repos?per_page=100&type=owner"
          )

          public_repos = rest_get(repos_url)

          for repo in public_repos:
              languages_url = repo.get(
                  "languages_url"
              )

              if not languages_url:
                  continue

              try:
                  repo_languages = rest_get(
                      languages_url
                  )
              except Exception:
                  continue

              for language, size in (
                  repo_languages.items()
              ):
                  language_sizes[language] = (
                      language_sizes.get(
                          language, 0
                      )
                      + size
                  )


          language_colors = {
              "PHP": "#4F5D95",
              "JavaScript": "#f1e05a",
              "TypeScript": "#3178c6",
              "HTML": "#e34c26",
              "CSS": "#563d7c",
              "Python": "#3572A5",
              "Java": "#b07219",
              "Shell": "#89e051",
              "C": "#555555",
              "C++": "#f34b7d",
              "C#": "#178600",
              "Ruby": "#701516",
              "Go": "#00ADD8",
              "Vue": "#41b883",
              "Blade": "#f7523f",
              "SCSS": "#c6538c"
          }


          total_language_size = sum(
              language_sizes.values()
          )

          sorted_languages = sorted(
              language_sizes.items(),
              key=lambda item: item[1],
              reverse=True
          )

          top_languages = []

          for language, size in (
              sorted_languages[:5]
          ):
              percentage = 0

              if total_language_size > 0:
                  percentage = (
                      size
                      / total_language_size
                      * 100
                  )

              top_languages.append({
                  "name": language,
                  "percentage": percentage,
                  "color": language_colors.get(
                      language,
                      "#8b949e"
                  )
              })


          # --------------------------------
          # Grade calculation
          # --------------------------------

          score = (
              total_stars * 5
              + commits * 2
              + prs * 3
              + issues
          )

          if score >= 1000:
              grade = "A+"
              grade_color = "#58a6ff"
          elif score >= 700:
              grade = "A"
              grade_color = "#58a6ff"
          elif score >= 400:
              grade = "B+"
              grade_color = "#58a6ff"
          elif score >= 200:
              grade = "B"
              grade_color = "#58a6ff"
          elif score >= 100:
              grade = "C+"
              grade_color = "#58a6ff"
          elif score >= 50:
              grade = "C"
              grade_color = "#58a6ff"
          else:
              grade = "D"
              grade_color = "#58a6ff"


          # --------------------------------
          # SVG language bar
          # --------------------------------

          language_bar = ""

          if top_languages:
              bar_x = 690
              bar_y = 185
              bar_width = 360
              current_x = bar_x

              for item in top_languages:
                  width = (
                      bar_width
                      * item["percentage"]
                      / 100
                  )

                  if width < 2:
                      continue

                  language_bar += (
                      f'<rect '
                      f'x="{current_x:.2f}" '
                      f'y="{bar_y}" '
                      f'width="{width:.2f}" '
                      f'height="10" '
                      f'fill="{item["color"]}"/>'
                  )

                  current_x += width


          # --------------------------------
          # SVG language list
          # --------------------------------

          language_list = ""

          for index, item in enumerate(
              top_languages
          ):
              column = index % 2
              row = index // 2

              x = 700 + column * 190
              y = 235 + row * 48

              language_name = html.escape(
                  item["name"]
              )

              language_list += f'''
              <circle
                cx="{x}"
                cy="{y - 6}"
                r="6"
                fill="{item["color"]}"
              />

              <text
                x="{x + 16}"
                y="{y}"
                class="language">
                {language_name}
                {item["percentage"]:.2f}%
              </text>
              '''

          if not top_languages:
              language_list = '''
              <text
                x="700"
                y="250"
                class="language">
                No public language data
              </text>
              '''


          # --------------------------------
          # SVG
          # --------------------------------

          display_name = html.escape(
              user["name"]
              or user["login"]
          )

          login = html.escape(
              user["login"]
          )

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="1100"
            height="620"
            viewBox="0 0 1100 620"
            role="img">

            <style>
              .section {{
                font: 700 24px Arial, sans-serif;
                fill: #d7e2f5;
              }}

              .card-title {{
                font: 700 18px Arial, sans-serif;
                fill: #8ab4f8;
              }}

              .metric {{
                font: 700 15px Arial, sans-serif;
                fill: #7dd3c7;
              }}

              .value {{
                font: 700 16px Arial, sans-serif;
                fill: #7dd3c7;
              }}

              .language {{
                font: 500 14px Arial, sans-serif;
                fill: #7dd3c7;
              }}

              .footer {{
                font: 500 15px Arial, sans-serif;
                fill: #9ca3af;
              }}

              .stat-label {{
                font: 500 14px Arial, sans-serif;
                fill: #cbd5e1;
              }}

              .stat-value {{
                font: 700 30px Arial, sans-serif;
              }}
            </style>

            <rect
              width="1100"
              height="620"
              fill="#ffffff"
            />

            <!-- Heading -->
            <text
              x="30"
              y="45"
              class="section">
              📊 GitHub Stats
            </text>

            <line
              x1="25"
              y1="62"
              x2="1075"
              y2="62"
              stroke="#cbd5e1"
              stroke-width="1"
            />

            <!-- Left Card -->
            <rect
              x="60"
              y="85"
              width="500"
              height="245"
              rx="5"
              fill="#1f2230"
            />

            <text
              x="85"
              y="115"
              class="card-title">
              {display_name}'s GitHub Stats
            </text>

            <text
              x="85"
              y="145"
              class="metric">
              ☆ Total Stars Earned:
            </text>

            <text
              x="430"
              y="145"
              class="value">
              {total_stars}
            </text>

            <text
              x="85"
              y="180"
              class="metric">
              ↻ Total Commits ({current_year}):
            </text>

            <text
              x="430"
              y="180"
              class="value">
              {commits}
            </text>

            <text
              x="85"
              y="215"
              class="metric">
              ⇅ Total PRs:
            </text>

            <text
              x="430"
              y="215"
              class="value">
              {prs}
            </text>

            <text
              x="85"
              y="250"
              class="metric">
              ⓘ Total Issues:
            </text>

            <text
              x="430"
              y="250"
              class="value">
              {issues}
            </text>

            <text
              x="85"
              y="285"
              class="metric">
              ▣ Contributed to (last year):
            </text>

            <text
              x="430"
              y="285"
              class="value">
              {contributed_last_year}
            </text>

            <!-- Grade circle -->
            <circle
              cx="500"
              cy="190"
              r="52"
              fill="#1f2230"
              stroke="#405274"
              stroke-width="5"
            />

            <circle
              cx="500"
              cy="190"
              r="48"
              fill="none"
              stroke="{grade_color}"
              stroke-width="6"
              stroke-dasharray="120 302"
              stroke-linecap="round"
              transform="rotate(-90 500 190)"
            />

            <text
              x="500"
              y="198"
              text-anchor="middle"
              style="font:700 22px Arial;fill:{grade_color};">
              {grade}
            </text>

            <!-- Right Card -->
            <rect
              x="565"
              y="85"
              width="450"
              height="245"
              rx="5"
              fill="#1f2230"
            />

            <text
              x="590"
              y="115"
              class="card-title">
              Most Used Languages
            </text>

            <!-- Language Bar Background -->
            <rect
              x="690"
              y="185"
              width="360"
              height="10"
              rx="5"
              fill="#39404b"
            />

            {language_bar}

            {language_list}

            <!-- Footer stats -->
            <line
              x1="590"
              y1="290"
              x2="990"
              y2="290"
              stroke="#4b5563"
            />

            <text
              x="615"
              y="315"
              style="font:500 16px Arial;fill:#d1d5db;">
              👥 Followers:
            </text>

            <text
              x="745"
              y="315"
              style="font:700 16px Arial;fill:#d1d5db;">
              {user["followers"]["totalCount"]}
            </text>

            <text
              x="820"
              y="315"
              style="font:500 16px Arial;fill:#d1d5db;">
              👤 Following:
            </text>

            <text
              x="950"
              y="315"
              style="font:700 16px Arial;fill:#d1d5db;">
              {user["following"]["totalCount"]}
            </text>

            <!-- Streak Section -->
            <line
              x1="25"
              y1="370"
              x2="1075"
              y2="370"
              stroke="#cbd5e1"
            />

            <text
              x="30"
              y="405"
              class="section">
              🔥 Streak Stats
            </text>

            <rect
              x="60"
              y="430"
              width="980"
              height="110"
              rx="5"
              fill="#1f2230"
            />

            <text
              x="150"
              y="475"
              class="stat-label">
              Current Streak
            </text>

            <text
              x="170"
              y="515"
              class="stat-value"
              fill="#58a6ff">
              0
            </text>

            <text
              x="210"
              y="515"
              class="stat-label">
              days
            </text>

            <text
              x="420"
              y="475"
              class="stat-label">
              Longest Streak
            </text>

            <text
              x="440"
              y="515"
              class="stat-value"
              fill="#a371f7">
              0
            </text>

            <text
              x="480"
              y="515"
              class="stat-label">
              days
            </text>

            <text
              x="700"
              y="475"
              class="stat-label">
              Total Contributions
            </text>

            <text
              x="770"
              y="515"
              class="stat-value"
              fill="#f2cc60">
              {user["currentYear"]["contributionCalendar"]["totalContributions"]}
            </text>

            <text
              x="30"
              y="590"
              class="footer">
              Note: Stats are updated daily via GitHub Actions 🚀
            </text>

          </svg>'''

          os.makedirs(
              "assets",
              exist_ok=True
          )

          with open(
              "assets/github-stats.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print("GitHub stats SVG generated successfully.")

          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "Update GitHub stats"
            git push
          fi
