name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate professional GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import html
          from datetime import datetime, timezone

          username = "sprexe"
          token = os.environ["GH_TOKEN"]

          now = datetime.now(timezone.utc)
          year_start = datetime(now.year, 1, 1, tzinfo=timezone.utc).isoformat()
          year_end = datetime(now.year, 12, 31, 23, 59, 59, tzinfo=timezone.utc).isoformat()

          query = """
          query(
            $login: String!,
            $from: DateTime!,
            $to: DateTime!
          ) {
            user(login: $login) {
              name
              login

              followers {
                totalCount
              }

              following {
                totalCount
              }

              repositories(
                ownerAffiliations: OWNER,
                first: 100,
                privacy: PUBLIC
              ) {
                totalCount
                nodes {
                  stargazerCount
                  languages(first: 10) {
                    edges {
                      size
                      node {
                        name
                        color
                      }
                    }
                  }
                }
              }

              contributionsCollection(
                from: $from,
                to: $to
              ) {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """

          payload = json.dumps({
              "query": query,
              "variables": {
                  "login": username,
                  "from": year_start,
                  "to": year_end
              }
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "sprexe-github-stats"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if "errors" in result:
              raise RuntimeError(json.dumps(result["errors"]))

          user = result["data"]["user"]

          if not user:
              raise RuntimeError("GitHub user not found")

          repositories = user["repositories"]
          contributions = user["contributionsCollection"]

          total_stars = sum(
              repo["stargazerCount"]
              for repo in repositories["nodes"]
          )

          language_sizes = {}
          language_colors = {}

          for repo in repositories["nodes"]:
              for edge in repo["languages"]["edges"]:
                  language = edge["node"]["name"]
                  size = edge["size"]
                  color = edge["node"]["color"] or "#8b949e"

                  language_sizes[language] = (
                      language_sizes.get(language, 0) + size
                  )

                  language_colors[language] = color

          top_languages = sorted(
              language_sizes.items(),
              key=lambda item: item[1],
              reverse=True
          )[:5]

          total_language_size = sum(
              size for _, size in top_languages
          )

          if total_language_size == 0:
              language_percentages = []
          else:
              language_percentages = [
                  (
                      language,
                      size,
                      round(size / total_language_size * 100, 1)
                  )
                  for language, size in top_languages
              ]

          commits = contributions["totalCommitContributions"]
          prs = contributions["totalPullRequestContributions"]
          issues = contributions["totalIssueContributions"]
          total_contributions = contributions[
              "contributionCalendar"
          ]["totalContributions"]

          score = (
              total_stars * 5
              + commits * 2
              + prs * 3
              + issues
              + total_contributions
          )

          if score >= 1000:
              grade = "A+"
          elif score >= 700:
              grade = "A"
          elif score >= 400:
              grade = "B+"
          elif score >= 200:
              grade = "B"
          elif score >= 100:
              grade = "C+"
          elif score >= 50:
              grade = "C"
          else:
              grade = "D"

          display_name = html.escape(
              user["name"] or user["login"]
          )

          svg_width = 1100
          svg_height = 440

          language_bar = ""
          language_list = ""

          if language_percentages:
              x_position = 620
              bar_width = 400

              for language, _, percentage in language_percentages:
                  width = bar_width * percentage / 100
                  color = language_colors.get(
                      language,
                      "#8b949e"
                  )

                  language_bar += (
                      f'<rect x="{x_position:.2f}" '
                      f'y="140" '
                      f'width="{width:.2f}" '
                      f'height="12" '
                      f'fill="{color}"/>'
                  )

                  x_position += width

              list_y = 195

              for index, (
                  language,
                  _,
                  percentage
              ) in enumerate(language_percentages):
                  color = language_colors.get(
                      language,
                      "#8b949e"
                  )

                  column = index % 2
                  row = index // 2

                  x = 620 + column * 200
                  y = list_y + row * 55

                  language_list += f'''
                  <circle cx="{x}" cy="{y - 5}"
                          r="6"
                          fill="{color}"/>
                  <text x="{x + 15}"
                        y="{y}"
                        class="language">
                    {html.escape(language)}
                  </text>
                  <text x="{x + 15}"
                        y="{y + 20}"
                        class="percentage">
                    {percentage}%
                  </text>
                  '''
          else:
              language_list = '''
              <text x="620"
                    y="210"
                    class="muted">
                No public language data available
              </text>
              '''

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="{svg_width}"
            height="{svg_height}"
            viewBox="0 0 {svg_width} {svg_height}"
            role="img"
            aria-labelledby="title description">

            <title id="title">
              {display_name}'s GitHub Statistics
            </title>

            <desc id="description">
              GitHub statistics and most used programming languages
            </desc>

            <style>
              .title {{
                font: 700 24px Arial, sans-serif;
                fill: #e6edf3;
              }}

              .subtitle {{
                font: 500 15px Arial, sans-serif;
                fill: #8b949e;
              }}

              .label {{
                font: 600 15px Arial, sans-serif;
                fill: #8b949e;
              }}

              .value {{
                font: 700 25px Arial, sans-serif;
                fill: #e6edf3;
              }}

              .language {{
                font: 600 14px Arial, sans-serif;
                fill: #c9d1d9;
              }}

              .percentage {{
                font: 500 13px Arial, sans-serif;
                fill: #8b949e;
              }}

              .muted {{
                font: 500 15px Arial, sans-serif;
                fill: #8b949e;
              }}
            </style>

            <rect
              width="100%"
              height="100%"
              rx="18"
              fill="#0d1117"/>

            <!-- Left stats card -->
            <rect
              x="30"
              y="30"
              width="510"
              height="380"
              rx="16"
              fill="#161b22"
              stroke="#30363d"/>

            <text
              x="65"
              y="80"
              class="title">
              {display_name}'s GitHub Stats
            </text>

            <text
              x="65"
              y="110"
              class="subtitle">
              @{html.escape(user["login"])} • Updated automatically
            </text>

            <line
              x1="65"
              y1="135"
              x2="505"
              y2="135"
              stroke="#30363d"/>

            <text
              x="65"
              y="180"
              class="label">
              Total Stars Earned
            </text>

            <text
              x="65"
              y="215"
              class="value">
              {total_stars}
            </text>

            <text
              x="280"
              y="180"
              class="label">
              Repositories
            </text>

            <text
              x="280"
              y="215"
              class="value">
              {repositories["totalCount"]}
            </text>

            <text
              x="65"
              y="275"
              class="label">
              Commits ({now.year})
            </text>

            <text
              x="65"
              y="310"
              class="value">
              {commits}
            </text>

            <text
              x="280"
              y="275"
              class="label">
              Pull Requests
            </text>

            <text
              x="280"
              y="310"
              class="value">
              {prs}
            </text>

            <text
              x="65"
              y="370"
              class="label">
              Issues
            </text>

            <text
              x="65"
              y="400"
              class="value">
              {issues}
            </text>

            <circle
              cx="450"
              cy="355"
              r="48"
              fill="none"
              stroke="#58a6ff"
              stroke-width="8"/>

            <text
              x="450"
              y="365"
              text-anchor="middle"
              style="font: 700 28px Arial, sans-serif; fill:#58a6ff;">
              {grade}
            </text>

            <!-- Right languages card -->
            <rect
              x="570"
              y="30"
              width="500"
              height="380"
              rx="16"
              fill="#161b22"
              stroke="#30363d"/>

            <text
              x="620"
              y="85"
              class="title">
              Most Used Languages
            </text>

            <text
              x="620"
              y="115"
              class="subtitle">
              Based on your public repositories
            </text>

            <rect
              x="620"
              y="140"
              width="400"
              height="12"
              rx="6"
              fill="#30363d"/>

            {language_bar}

            {language_list}

            <line
              x1="620"
              y1="350"
              x2="1020"
              y2="350"
              stroke="#30363d"/>

            <text
              x="620"
              y="385"
              class="subtitle">
              Followers: {user["followers"]["totalCount"]}
            </text>

            <text
              x="850"
              y="385"
              class="subtitle">
              Following: {user["following"]["totalCount"]}
            </text>

          </svg>'''

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/github-stats.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)
          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "Update GitHub stats"
            git push
          fi
