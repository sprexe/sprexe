name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse
          import html
          from datetime import datetime, timezone

          username = "sprexe"
          token = os.environ["GH_TOKEN"]

          now = datetime.now(timezone.utc)
          current_year = now.year

          year_start = datetime(
              current_year, 1, 1,
              0, 0, 0,
              tzinfo=timezone.utc
          ).isoformat()

          year_end = now.isoformat()

          last_year_start = datetime(
              current_year - 1, 1, 1,
              0, 0, 0,
              tzinfo=timezone.utc
          ).isoformat()

          last_year_end = datetime(
              current_year - 1, 12, 31,
              23, 59, 59,
              tzinfo=timezone.utc
          ).isoformat()


          def graphql(query, variables):
              payload = json.dumps({
                  "query": query,
                  "variables": variables
              }).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                      "User-Agent": "sprexe-github-stats"
                  }
              )

              with urllib.request.urlopen(
                  request
              ) as response:
                  data = json.load(response)

              if "errors" in data:
                  raise RuntimeError(
                      json.dumps(data["errors"])
                  )

              return data["data"]


          def rest_get(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "sprexe-github-stats",
                      "X-GitHub-Api-Version": "2022-11-28"
                  }
              )

              with urllib.request.urlopen(
                  request
              ) as response:
                  return json.load(response)


          # --------------------------------
          # GitHub GraphQL statistics
          # --------------------------------

          query = """
          query(
            $login: String!,
            $currentFrom: DateTime!,
            $currentTo: DateTime!,
            $lastFrom: DateTime!,
            $lastTo: DateTime!
          ) {
            user(login: $login) {
              name
              login

              followers {
                totalCount
              }

              following {
                totalCount
              }

              repositories(
                ownerAffiliations: OWNER,
                first: 100,
                privacy: PUBLIC
              ) {
                totalCount

                nodes {
                  name
                  stargazerCount
                }
              }

              currentYear: contributionsCollection(
                from: $currentFrom,
                to: $currentTo
              ) {
                totalCommitContributions
                totalPullRequestContributions
                totalIssueContributions

                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }

              lastYear: contributionsCollection(
                from: $lastFrom,
                to: $lastTo
              ) {
                contributionCalendar {
                  totalContributions
                }
              }
            }
          }
          """

          data = graphql(
              query,
              {
                  "login": username,
                  "currentFrom": year_start,
                  "currentTo": year_end,
                  "lastFrom": last_year_start,
                  "lastTo": last_year_end
              }
          )

          user = data["user"]

          if not user:
              raise RuntimeError(
                  "GitHub user not found"
              )

          repositories = (
              user["repositories"]["nodes"]
          )

          total_stars = sum(
              repo["stargazerCount"]
              for repo in repositories
          )

          repository_count = (
              user["repositories"]["totalCount"]
          )

          commits = (
              user["currentYear"]
              ["totalCommitContributions"]
          )

          prs = (
              user["currentYear"]
              ["totalPullRequestContributions"]
          )

          issues = (
              user["currentYear"]
              ["totalIssueContributions"]
          )

          contributed_last_year = (
              user["lastYear"]
              ["contributionCalendar"]
              ["totalContributions"]
          )

          total_contributions = (
              user["currentYear"]
              ["contributionCalendar"]
              ["totalContributions"]
          )


          # --------------------------------
          # GitHub REST API language data
          # --------------------------------

          language_sizes = {}

          repos_url = (
              f"https://api.github.com/users/"
              f"{urllib.parse.quote(username)}/repos"
              f"?per_page=100&type=owner&sort=updated"
          )

          public_repos = rest_get(repos_url)

          for repo in public_repos:

              if repo.get("private"):
                  continue

              if repo.get("fork"):
                  continue

              owner_login = (
                  repo.get("owner", {})
                  .get("login", username)
              )

              repo_name = repo.get("name")

              if not repo_name:
                  continue

              languages_url = (
                  "https://api.github.com/repos/"
                  + urllib.parse.quote(owner_login)
                  + "/"
                  + urllib.parse.quote(repo_name)
                  + "/languages"
              )

              try:
                  repo_languages = rest_get(
                      languages_url
                  )

                  print(
                      f"Repository: {repo_name} "
                      f"| Languages: {repo_languages}"
                  )

              except Exception as error:
                  print(
                      f"Could not get languages for "
                      f"{repo_name}: {error}"
                  )
                  continue

              for language, size in (
                  repo_languages.items()
              ):

                  if not isinstance(
                      size,
                      (int, float)
                  ):
                      continue

                  language_sizes[language] = (
                      language_sizes.get(
                          language,
                          0
                      )
                      + size
                  )

          print(
              "Combined language data:",
              language_sizes
          )


          # --------------------------------
          # Language colors
          # --------------------------------

          language_colors = {
              "PHP": "#4F5D95",
              "JavaScript": "#f1e05a",
              "TypeScript": "#3178c6",
              "HTML": "#e34c26",
              "CSS": "#563d7c",
              "Python": "#3572A5",
              "Java": "#b07219",
              "Shell": "#89e051",
              "C": "#555555",
              "C++": "#f34b7d",
              "C#": "#178600",
              "Ruby": "#701516",
              "Go": "#00ADD8",
              "Vue": "#41b883",
              "Blade": "#f7523f",
              "SCSS": "#c6538c",
              "Sass": "#c6538c",
              "Dockerfile": "#384d54",
              "JSON": "#292929"
          }


          total_language_size = sum(
              language_sizes.values()
          )

          sorted_languages = sorted(
              language_sizes.items(),
              key=lambda item: item[1],
              reverse=True
          )

          top_languages = []

          for language, size in (
              sorted_languages[:5]
          ):

              percentage = 0

              if total_language_size > 0:
                  percentage = (
                      size
                      / total_language_size
                      * 100
                  )

              top_languages.append({
                  "name": language,
                  "percentage": percentage,
                  "color": language_colors.get(
                      language,
                      "#8b949e"
                  )
              })


          # --------------------------------
          # Grade calculation
          # --------------------------------

          score = (
              total_stars * 5
              + commits * 2
              + prs * 3
              + issues
              + total_contributions
          )

          if score >= 1000:
              grade = "A+"
          elif score >= 700:
              grade = "A"
          elif score >= 400:
              grade = "B+"
          elif score >= 200:
              grade = "B"
          elif score >= 100:
              grade = "C+"
          elif score >= 50:
              grade = "C"
          else:
              grade = "D"

          grade_color = "#58a6ff"


          # --------------------------------
          # Language bar
          # --------------------------------

          language_bar = ""

          if top_languages:

              bar_x = 705
              bar_y = 160
              bar_width = 300
              current_x = bar_x

              for index, item in enumerate(
                  top_languages
              ):

                  if index == len(top_languages) - 1:
                      width = (
                          bar_x
                          + bar_width
                          - current_x
                      )
                  else:
                      width = (
                          bar_width
                          * item["percentage"]
                          / 100
                      )

                  if width <= 0:
                      continue

                  language_bar += (
                      f'<rect '
                      f'x="{current_x:.2f}" '
                      f'y="{bar_y}" '
                      f'width="{width:.2f}" '
                      f'height="10" '
                      f'fill="{item["color"]}"/>'
                  )

                  current_x += width


          # --------------------------------
          # Language list
          # --------------------------------

          language_list = ""

          for index, item in enumerate(
              top_languages
          ):

              column = index % 2
              row = index // 2

              x = 705 + (
                  column * 165
              )

              y = 215 + (
                  row * 38
              )

              language_name = html.escape(
                  item["name"]
              )

              language_list += f'''
              <circle
                cx="{x}"
                cy="{y - 5}"
                r="5"
                fill="{item["color"]}"
              />

              <text
                x="{x + 14}"
                y="{y}"
                class="language">
                {language_name}
                {item["percentage"]:.2f}%
              </text>
              '''

          if not top_languages:

              language_list = '''
              <text
                x="705"
                y="230"
                class="language">
                No public language data
              </text>
              '''


          # --------------------------------
          # Display values
          # --------------------------------

          display_name = html.escape(
              user["name"]
              or user["login"]
          )

          followers = (
              user["followers"]["totalCount"]
          )

          following = (
              user["following"]["totalCount"]
          )


          # --------------------------------
          # SVG
          # --------------------------------

          svg = f'''<svg
            xmlns="http://www.w3.org/2000/svg"
            width="1100"
            height="620"
            viewBox="0 0 1100 620"
            role="img"
            aria-label="GitHub statistics">

            <style>
              .section {{
                font: 700 22px Arial, sans-serif;
                fill: #aab6c7;
              }}

              .card-title {{
                font: 700 18px Arial, sans-serif;
                fill: #9fc1ef;
              }}

              .metric {{
                font: 700 14px Arial, sans-serif;
                fill: #7dd3c7;
              }}

              .value {{
                font: 700 15px Arial, sans-serif;
                fill: #7dd3c7;
              }}

              .language {{
                font: 500 13px Arial, sans-serif;
                fill: #7dd3c7;
              }}

              .footer {{
                font: 500 14px Arial, sans-serif;
                fill: #8b949e;
              }}

              .stat-label {{
                font: 500 14px Arial, sans-serif;
                fill: #cbd5e1;
              }}

              .stat-value {{
                font: 700 30px Arial, sans-serif;
              }}
            </style>

            <rect
              width="1100"
              height="620"
              fill="#ffffff"
            />

            <!-- GitHub Stats heading -->
            <text
              x="30"
              y="45"
              class="section">
              📊 GitHub Stats
            </text>

            <line
              x1="25"
              y1="62"
              x2="1075"
              y2="62"
              stroke="#cbd5e1"
              stroke-width="1"
            />

            <!-- Stats background -->
            <rect
              x="55"
              y="82"
              width="990"
              height="255"
              rx="8"
              fill="#151922"
            />

            <!-- Left card -->
            <rect
              x="75"
              y="102"
              width="470"
              height="215"
              rx="6"
              fill="#1f2230"
              stroke="#344050"
            />

            <text
              x="100"
              y="132"
              class="card-title">
              {display_name}'s GitHub Stats
            </text>

            <text
              x="100"
              y="163"
              class="metric">
              ☆ Total Stars Earned:
            </text>

            <text
              x="435"
              y="163"
              class="value">
              {total_stars}
            </text>

            <text
              x="100"
              y="195"
              class="metric">
              ↻ Total Commits ({current_year}):
            </text>

            <text
              x="435"
              y="195"
              class="value">
              {commits}
            </text>

            <text
              x="100"
              y="227"
              class="metric">
              ⇅ Total PRs:
            </text>

            <text
              x="435"
              y="227"
              class="value">
              {prs}
            </text>

            <text
              x="100"
              y="259"
              class="metric">
              ⓘ Total Issues:
            </text>

            <text
              x="435"
              y="259"
              class="value">
              {issues}
            </text>

            <text
              x="100"
              y="291"
              class="metric">
              ▣ Contributed to (last year):
            </text>

            <text
              x="435"
              y="291"
              class="value">
              {contributed_last_year}
            </text>

            <!-- Grade circle -->
            <circle
              cx="495"
              cy="210"
              r="42"
              fill="#1f2230"
              stroke="#405274"
              stroke-width="5"
            />

            <circle
              cx="495"
              cy="210"
              r="39"
              fill="none"
              stroke="{grade_color}"
              stroke-width="5"
              stroke-dasharray="95 245"
              stroke-linecap="round"
              transform="rotate(-90 495 210)"
            />

            <text
              x="495"
              y="218"
              text-anchor="middle"
              style="font:700 21px Arial;fill:{grade_color};">
              {grade}
            </text>

            <!-- Right card -->
            <rect
              x="565"
              y="102"
              width="460"
              height="215"
              rx="6"
              fill="#1f2230"
              stroke="#344050"
            />

            <text
              x="590"
              y="132"
              class="card-title">
              Most Used Languages
            </text>

            <!-- Language bar background -->
            <rect
              x="705"
              y="160"
              width="300"
              height="10"
              rx="5"
              fill="#39404b"
            />

            {language_bar}

            {language_list}

            <!-- Followers -->
            <line
              x1="590"
              y1="278"
              x2="1000"
              y2="278"
              stroke="#39404b"
            />

            <text
              x="620"
              y="303"
              style="font:500 14px Arial;fill:#cbd5e1;">
              👥 Followers:
            </text>

            <text
              x="735"
              y="303"
              style="font:700 14px Arial;fill:#cbd5e1;">
              {followers}
            </text>

            <text
              x="835"
              y="303"
              style="font:500 14px Arial;fill:#cbd5e1;">
              👤 Following:
            </text>

            <text
              x="950"
              y="303"
              style="font:700 14px Arial;fill:#cbd5e1;">
              {following}
            </text>

            <!-- Streak heading -->
            <line
              x1="25"
              y1="370"
              x2="1075"
              y2="370"
              stroke="#cbd5e1"
            />

            <text
              x="30"
              y="405"
              class="section">
              🔥 Streak Stats
            </text>

            <!-- Streak card -->
            <rect
              x="55"
              y="425"
              width="990"
              height="110"
              rx="6"
              fill="#1f2230"
            />

            <text
              x="150"
              y="470"
              class="stat-label">
              Current Streak
            </text>

            <text
              x="180"
              y="510"
              class="stat-value"
              fill="#58a6ff">
              0
            </text>

            <text
              x="225"
              y="510"
              class="stat-label">
              days
            </text>

            <text
              x="430"
              y="470"
              class="stat-label">
              Longest Streak
            </text>

            <text
              x="455"
              y="510"
              class="stat-value"
              fill="#a371f7">
              0
            </text>

            <text
              x="500"
              y="510"
              class="stat-label">
              days
            </text>

            <text
              x="710"
              y="470"
              class="stat-label">
              Total Contributions
            </text>

            <text
              x="790"
              y="510"
              class="stat-value"
              fill="#f2cc60">
              {total_contributions}
            </text>

            <text
              x="30"
              y="590"
              class="footer">
              Note: Stats are updated daily via GitHub Actions 🚀
            </text>

          </svg>'''

          os.makedirs(
              "assets",
              exist_ok=True
          )

          with open(
              "assets/github-stats.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print(
              "GitHub stats SVG generated successfully."
          )

          PY

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-stats.svg

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "Update GitHub stats"
            git push
          fi
